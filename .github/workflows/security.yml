name: Security

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "src/**", "extension/**", "tests/**", ".github/workflows/security.yml"]
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  snyk:
    name: Snyk Code
    runs-on: ubuntu-latest
    # Fork pull requests cannot read the token; they are covered by CI and cargo audit.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: snyk/actions/setup@master
      - name: snyk code test
        if: env.SNYK_TOKEN != ''
        run: snyk code test --severity-threshold=low
      - name: Token missing
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::SNYK_TOKEN repository secret is not set, so Snyk did not run."

  fuzz:
    name: fuzz (parser, resolver, OPML)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release --test fuzz_test
      - name: Python fuzz harness
        run: python3 fuzz_python.py
