name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t podcast-rescue .
      - name: Container starts and serves the UI
        run: |
          docker run -d --name pr -p 3000:3000 podcast-rescue
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 1; done
          docker logs pr; exit 1
