name: Build Cross-Platform Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux Binary
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p artifacts
          cp target/release/podcast-rescue artifacts/podcast-rescue-linux-x86_64
          chmod +x artifacts/podcast-rescue-linux-x86_64
      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: podcast-rescue-linux-x86_64
          path: artifacts/podcast-rescue-linux-x86_64

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows Binary
        run: cargo build --release
      - name: Package Standalone Binary
        shell: bash
        run: |
          mkdir -p artifacts
          cp target/release/podcast-rescue.exe artifacts/podcast-rescue-windows-x86_64.exe
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
      - name: Build Windows Installer (Setup.exe)
        shell: pwsh
        run: |
          mkdir -p dist/packages
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/podcast-rescue-setup.iss /DAppVersion=0.4.0
          cp dist/packages/podcast-rescue-windows-x86_64-setup.exe artifacts/
      - name: Upload Windows Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          name: podcast-rescue-windows-x86_64.exe
          path: artifacts/podcast-rescue-windows-x86_64.exe
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: podcast-rescue-windows-x86_64-setup.exe
          path: artifacts/podcast-rescue-windows-x86_64-setup.exe

  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Apple Silicon and Intel Targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build Apple Silicon (ARM64)
        run: cargo build --release --target aarch64-apple-darwin
      - name: Build Intel (x86_64)
        run: cargo build --release --target x86_64-apple-darwin
      - name: Create Universal Binary
        run: |
          mkdir -p artifacts
          lipo -create -output artifacts/podcast-rescue-macos-universal \
            target/aarch64-apple-darwin/release/podcast-rescue \
            target/x86_64-apple-darwin/release/podcast-rescue
          chmod +x artifacts/podcast-rescue-macos-universal
      - name: Upload macOS Universal Binary
        uses: actions/upload-artifact@v4
        with:
          name: podcast-rescue-macos-universal
          path: artifacts/podcast-rescue-macos-universal
